# /etc/nginx/sites-available/dashboard  (symlink into sites-enabled)
# Serves the Angular build and proxies /api to the .NET API on the same origin, so no CORS is needed.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/dashboard/browser;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5080;
    }

    # Hashed bundles can be cached forever; index.html must always be fresh to pick up deploys.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
